[package]
name = "cmdtrail"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Bounded, capability-declared receipts for observable command side effects"
license = "MIT"
repository = "https://github.com/yhay81/cmdtrail"
homepage = "https://github.com/yhay81/cmdtrail"
readme = "README.md"
keywords = ["cli", "agents", "observability", "audit", "receipts"]
categories = ["command-line-utilities", "development-tools", "filesystem"]
exclude = [".github/"]

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
clap_complete = "4.6.8"
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.151"
sha2 = "0.11.0"
walkdir = "2.5.0"

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
