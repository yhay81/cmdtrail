name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "59 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust quality components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: v1 evidence gate tests
        run: |
          python3 -m unittest discover \
            -s scripts/tests -p 'test_verify_v1_evidence.py'
          python3 scripts/verify_v1_evidence.py \
            .github/v1-evidence.json --check-structure
      - name: Redaction corpus
        run: |
          python3 tests/fixtures/redaction/v0.1/generate_corpus.py --check
          cargo test --locked redact::corpus_tests::published_redaction_metrics_are_reproducible
      - name: Benchmark harness
        shell: bash
        run: |
          bash -n benchmarks/run.sh
          fixture="${RUNNER_TEMP}/cmdtrail-benchmark-smoke"
          python3 benchmarks/generate_tree.py \
            --files 4 --directories 2 --output "${fixture}" >"${fixture}.json"
          jq -e '
            .schema_version == "cmdtrail.benchmark-tree.v1"
            and .files == 4
            and .directories == 2
            and .entries == 6
            and (.content_sha256 | length == 64)
          ' "${fixture}.json" >/dev/null
          test "$(find "${fixture}" -type f | wc -l)" -eq 4

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned cargo-audit
        shell: bash
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 install cargo-audit --version 0.22.2 \
            --locked --no-default-features
      - name: Audit Rust dependencies
        run: cargo +1.88.0 audit --deny warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install declared MSRV
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check with Rust 1.85
        run: cargo +1.85.0 check --all-targets --locked

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Package
        run: cargo package --locked --allow-dirty
      - name: Receipt compatibility corpus
        shell: bash
        run: |
          jq -e . tests/fixtures/contracts/v0.1/manifest.json >/dev/null
          jq -e . tests/fixtures/contracts/v0.1/portable.receipt.json >/dev/null
          python3 tests/fixtures/contracts/v0.1/verify_golden.py \
            tests/fixtures/contracts/v0.1/portable.receipt.json
          python3 tests/fixtures/contracts/v0.1/test_verify_golden.py
      - name: Machine contracts and completions
        shell: bash
        run: |
          cargo build --locked
          target/debug/cmdtrail schema --format json | jq -e . >/dev/null
          target/debug/cmdtrail capabilities --format json | jq -e . >/dev/null
          target/debug/cmdtrail contract --format json | jq -e . >/dev/null
          for shell in bash zsh fish powershell elvish; do
            test -n "$(target/debug/cmdtrail completions "${shell}")"
          done
      - name: External receipt lifecycle
        shell: bash
        run: |
          fixture_root="$(mktemp -d)"
          trap 'rm -rf "${fixture_root}"' EXIT
          mkdir "${fixture_root}/observed"
          target/debug/cmdtrail record \
            --out "${fixture_root}/receipt.json" \
            --cwd "${fixture_root}/observed" \
            --root . \
            -- sh -c 'printf observed > generated.txt'
          target/debug/cmdtrail verify "${fixture_root}/receipt.json" \
            | jq -e '.integrity_valid' >/dev/null
          target/debug/cmdtrail show "${fixture_root}/receipt.json" --summary \
            | jq -e '.summary.file_effect_counts.created >= 1' >/dev/null
      - name: Documentation inventory
        shell: bash
        run: |
          for file in README.md CONCEPT.md ROADMAP.md CHANGELOG.md RELEASING.md \
              SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md GOVERNANCE.md \
              SUPPORT.md ADOPTERS.md LICENSE docs/*.md; do
            test -s "${file}"
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test library and CLI
        run: cargo test --all-targets --locked
      - name: Build release binary
        run: cargo build --release --locked
